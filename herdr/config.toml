onboarding = false

[keys]
prefix = "ctrl+space"
previous_tab = ["alt+j", "cmd+j"]
next_tab = ["alt+k", "cmd+k"]
next_workspace = ["alt+shift+j", "cmd+shift+j"]
previous_workspace = ["alt+shift+k", "cmd+shift+k"]
cycle_pane_next = ["prefix+tab", "ctrl+w"]
toggle_sidebar = ["prefix+b", "alt+shift+h"]

[[keys.command]]
key = "alt+l"
type = "shell"
command = "~/.config/herdr/claude-toggle.sh"
description = "toggle claude tab"

[ui]
agent_panel_sort = "spaces"
sidebar_collapsed_mode = "hidden"
